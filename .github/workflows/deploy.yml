name: Deploy

# Déploiement MANUEL et explicite (base de production) :
# Actions → Deploy → Run workflow. Protéger l'environnement "production"
# (Settings → Environments → Required reviewers) pour exiger une validation.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Éléments à déployer"
        type: choice
        options: [all, database, functions]
        default: all

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lier le projet
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Appliquer les migrations (sans seed de démo)
        if: inputs.target == 'all' || inputs.target == 'database'
        run: supabase db push

      - name: Déployer les Edge Functions
        if: inputs.target == 'all' || inputs.target == 'functions'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
