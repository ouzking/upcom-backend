# Configuration Supabase CLI — environnement LOCAL.
# Les paramètres du projet hébergé (production) se règlent dans le dashboard
# Supabase ; voir README.md § « Configuration du projet Supabase ».

project_id = "upcom-backend"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Serveur mail de test : les e-mails Auth (invitation, reset) sont visibles sur http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# URL du back-office (upcom-admin) : cible des liens d'invitation / réinitialisation.
site_url = "http://localhost:5174"
additional_redirect_urls = ["http://localhost:5174/**", "http://127.0.0.1:5174/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Pas d'inscription publique : comptes créés par invitation (admin-invite-user).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# -----------------------------------------------------------------------------
# Edge Functions
# verify_jwt = false : la fonction applique elle-même son contrôle d'accès
# (formulaires publics : validation + anti-spam ; notifications : secret
# webhook OU JWT + permission). Compatible avec les nouvelles clés
# publishable (sb_publishable_…) qui ne sont pas des JWT.
# -----------------------------------------------------------------------------
[functions.submit-quote-request]
verify_jwt = false

[functions.submit-contact-message]
verify_jwt = false

[functions.send-quote-notification]
verify_jwt = false

[functions.send-contact-notification]
verify_jwt = false

# Réservée aux utilisateurs connectés : double contrôle (passerelle + code).
[functions.admin-invite-user]
verify_jwt = true
